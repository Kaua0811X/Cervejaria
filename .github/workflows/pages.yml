name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: "Diagnostic: Node / npm / tsc"
        run: |
          node -v
          npm -v
          npx -v
          npx tsc --version || true
          echo "--- tsconfig.json ---"
          cat tsconfig.json || true

      - name: Install dependencies
        run: npm ci

      - name: Pre-build TypeScript check
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Build
        run: npm run build
        env:
          GH_PAGES_BASE_PATH: /Cervejaria/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
