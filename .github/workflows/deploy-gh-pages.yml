name: Build and Deploy to gh-pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client dependencies 📦
        run: |
          cd Client
          npm install

      - name: Build Client (force with explicit base) 🏗️
        run: |
          cd Client
          npx vite build --base=/Cervejaria/

      - name: Deploy Client dist to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Client/dist
          branch: gh-pages
          clean: true

